<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Signature 10 - Ribbon Style</title>
</head>
<body style="margin:0; padding:0; background-color:#e0e0e0; height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif;">

  <!-- Signature Container -->
  <table cellpadding="0" cellspacing="0" role="presentation" style="border-radius:12px; overflow:hidden; max-width:500px; width:100%; box-shadow:0 5px 15px rgba(0,0,0,0.2);">

    <!-- Top Ribbon -->
    <tr>
      <td colspan="2" style="background-color:#e67e22; color:#ffffff; text-align:center; padding:12px; font-weight:bold; font-size:18px;">
        Ababil Hassan | Front-End Developer
      </td>
    </tr>

    <!-- Main Row -->
    <tr>
      <!-- Profile Image -->
      <td style="width:120px; text-align:center; padding:15px; background-color:#ffffff;">
        <img src="profile-image.png" width="80" height="80" style="border-radius:50%; border:3px solid #e67e22;" alt="Ababil Hassan">
      </td>

      <!-- Info -->
      <td style="background-color:#ffffff; padding:15px; color:#222;">
        <div style="font-size:13px; margin-bottom:4px;">📞 <a href="tel:+8801234567890" style="color:#e67e22; text-decoration:none;">+880 1234-567890</a></div>
        <div style="font-size:13px; margin-bottom:4px;">✉️ <a href="mailto:ababil@email.com" style="color:#e67e22; text-decoration:none;">ababil@email.com</a></div>
        <div style="font-size:13px; margin-bottom:4px;">🌐 <a href="https://ababilhassan.dev" style="color:#e67e22; text-decoration:none;">ababilhassan.dev</a></div>
        <div style="font-size:13px;">📅 Mon-Fri 9am-6pm</div>
      </td>
    </tr>

    <!-- Bottom Ribbon for Socials -->
    <tr>
      <td colspan="2" style="background-color:#e67e22; text-align:center; padding:10px;">
        <a href="https://linkedin.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" width="20" height="20" alt="LinkedIn"></a>
        <a href="https://github.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733553.png" width="20" height="20" alt="GitHub"></a>
        <a href="https://twitter.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" width="20" height="20" alt="Twitter"></a>
      </td>
    </tr>

  </table>

</body>
</html>
